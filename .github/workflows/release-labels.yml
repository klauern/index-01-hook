name: Validate release labels

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  release-labels:
    name: Check release label conflicts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate labels
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const labels = JSON.parse(readFileSync(0, "utf8"))?.pull_request?.labels;
            if (!Array.isArray(labels) || labels.some((label) =>
              typeof label?.name !== "string" || label.name.length === 0
            )) process.exit(1);
            const recognized = new Set(["release:major", "release:minor", "release:patch"]);
            const selected = labels.filter((label) => recognized.has(label.name));
            if (selected.length > 1) process.exit(1);
          ' < "$GITHUB_EVENT_PATH"
