apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: index-01-hook-default-deny
  namespace: index-01-hook
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: index-01-hook-webhook-ingress
  namespace: index-01-hook
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: index-01-hook
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# Selected egress control: portable broad public-HTTPS egress. Standard
# NetworkPolicy cannot restrict TCP 443 by DNS name, so provider-only (FQDN)
# egress is not possible here. See docs/kubernetes.md ("Ingress and network
# policy") for the documented limitation and the operator-approval
# requirement before production use.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: index-01-hook-provider-egress
  namespace: index-01-hook
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: index-01-hook
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.31.196.0/24
              - 192.52.193.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 192.175.48.0/24
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - 64:ff9b:1::/48
              - 100::/64
              - 2001::/23
              - 2001:2::/48
              - 2001:db8::/32
              - 2002::/16
              - 2620:4f:8000::/48
              - 3fff::/20
              - 5f00::/16
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports:
        - protocol: TCP
          port: 443
